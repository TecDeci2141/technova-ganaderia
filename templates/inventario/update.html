{% extends "base.html" %}
{% block title %}Editar Ingrediente - Inventario{% endblock %}

{% block content %}
<div class="container py-4 animate-fade-in">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="glass-card p-4 p-md-5">
        <h2 class="mb-4 fw-bold text-center">
          <i class="bi bi-pencil-square text-warning me-2"></i> Editar Ingrediente
        </h2>

        <form method="POST" action="{{ url_for('inventario_update', id=item['id']) }}">
          <div class="row g-4">
            <div class="col-12">
              <label for="ingredientes" class="form-label fw-semibold">Nombre del Ingrediente / Insumo</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary">
                  <i class="bi bi-tag-fill"></i>
                </span>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="ingredientes" name="ingredientes" value="{{ item['ingredientes'] }}" required>
              </div>
            </div>

            <div class="col-md-6">
              <label for="cantidad" class="form-label fw-semibold">Cantidad Disponible</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary">
                  <i class="bi bi-hash"></i>
                </span>
                <input type="number" step="0.01" class="form-control bg-dark text-light border-secondary" id="cantidad" name="cantidad" value="{{ item['cantidad'] }}" required>
              </div>
            </div>

            <div class="col-md-6 d-flex align-items-end">
              <div class="w-100">
                <label class="form-label fw-semibold text-transparent">Acción</label>
                <div class="d-grid">
                  <button type="submit" class="btn btn-warning btn-lg text-dark fw-bold">
                    <i class="bi bi-check-circle-fill me-2"></i>Actualizar Registro
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>

        <div class="mt-4 text-center">
          <a href="{{ url_for('inventario_list') }}" class="btn btn-outline-secondary">
            <i class="bi bi-x-circle me-2"></i>Cancelar y Volver
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
