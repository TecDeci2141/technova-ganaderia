{% extends "base.html" %} 
{% block title %}Nuevo Ingrediente - Inventario{% endblock %} 

{% block content %}
<div class="container py-4 animate-fade-in">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="glass-card p-4 p-md-5">
        <h2 class="mb-4 fw-bold text-center">
          <i class="bi bi-box-seam-fill text-success me-2"></i> Registrar en Inventario
        </h2>

        <form method="POST" action="{{ url_for('inventario_insert') }}">
          <div class="row g-4">
            <div class="col-12">
              <label for="ingredientes" class="form-label fw-semibold">Nombre del Ingrediente / Insumo</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary">
                  <i class="bi bi-tag-fill"></i>
                </span>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="ingredientes" name="ingredientes" placeholder="Ej: Maíz molido, Sal mineral, etc." required>
              </div>
            </div>

            <div class="col-md-6">
              <label for="cantidad" class="form-label fw-semibold">Cantidad Disponible</label>
              <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary">
                  <i class="bi bi-hash"></i>
                </span>
                <input type="number" step="0.01" class="form-control bg-dark text-light border-secondary" id="cantidad" name="cantidad" placeholder="0.00" required>
              </div>
              <div class="form-text text-muted">Puedes usar decimales (ej: 150.50 kg o unidades)</div>
            </div>

            <div class="col-md-6 d-flex align-items-end">
              <div class="w-100">
                <label class="form-label fw-semibold text-transparent">Acción</label>
                <div class="d-grid">
                  <button type="submit" class="btn btn-success btn-lg">
                    <i class="bi bi-check-circle-fill me-2"></i>Guardar Registro
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>

        <div class="mt-4 text-center">
          <a href="{{ url_for('inventario_list') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>Volver al Listado
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
