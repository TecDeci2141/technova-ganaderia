{% extends "base.html" %} 
{% block title %}Editar Registro de Ganado{% endblock %} 

{% block content %}
<div class="container py-4 animate-fade-in">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <form method="POST" action="{{ url_for('ganado_update', id=row['id']) }}">
        
        <!-- Sección 1: Identificación -->
        <div class="glass-card p-4 mb-4">
          <h4 class="fw-bold mb-3 text-primary"><i class="bi bi-tag-fill me-2"></i>Identificación Básica</h4>
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label fw-semibold">Número de Arete</label>
              <input type="text" name="arete" class="form-control bg-dark text-light border-secondary" value="{{ row['arete'] }}" readonly title="El arete no se puede modificar">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Sexo</label>
              <select name="sexo" class="form-select bg-dark text-light border-secondary" required>
                <option value="Macho" {% if row['sexo'] == 'Macho' %}selected{% endif %}>Macho</option>
                <option value="Hembra" {% if row['sexo'] == 'Hembra' %}selected{% endif %}>Hembra</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Raza</label>
              <input type="text" name="raza" class="form-control bg-dark text-light border-secondary" value="{{ row['raza'] }}">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Fecha de Ingreso</label>
              <input type="date" name="fecha_ingreso" class="form-control bg-dark text-light border-secondary" value="{{ row['fecha_ingreso'] }}" required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Edad (meses)</label>
              <input type="number" name="edad_meses" class="form-control bg-dark text-light border-secondary" value="{{ row['edad_meses'] }}">
            </div>
          </div>
        </div>

        <!-- Sección 2: Pesos y Ubicación -->
        <div class="glass-card p-4 mb-4">
          <h4 class="fw-bold mb-3 text-success"><i class="bi bi-bar-chart-line-fill me-2"></i>Pesos y Ubicación</h4>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Peso Inicial (kg)</label>
              <input type="number" step="0.01" name="peso_inicial_kg" class="form-control bg-dark text-light border-secondary" value="{{ row['peso_inicial_kg'] }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Peso Actual (kg)</label>
              <input type="number" step="0.01" name="peso_actual_kg" class="form-control bg-dark text-light border-secondary" value="{{ row['peso_actual_kg'] }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Potrero Actual</label>
              <input type="text" name="potrero_actual" class="form-control bg-dark text-light border-secondary" value="{{ row['potrero_actual'] }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Tipo de Alimentación</label>
              <input type="text" name="alimentacion" class="form-control bg-dark text-light border-secondary" value="{{ row['alimentacion'] }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Proveedor / Origen</label>
              <input type="text" name="proveedor" class="form-control bg-dark text-light border-secondary" value="{{ row['proveedor'] }}">
            </div>
          </div>
        </div>

        <!-- Sección 3: Comercialización y Estado -->
        <div class="glass-card p-4 mb-4">
          <h4 class="fw-bold mb-3 text-warning"><i class="bi bi-cash-stack me-2"></i>Comercialización y Estado</h4>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Estado</label>
              <select name="estado" class="form-select bg-dark text-light border-secondary">
                <option value="En Engorda" {% if row['estado'] == 'En Engorda' %}selected{% endif %}>En Engorda</option>
                <option value="Listo para Venta" {% if row['estado'] == 'Listo para Venta' %}selected{% endif %}>Listo para Venta</option>
                <option value="Vendido" {% if row['estado'] == 'Vendido' %}selected{% endif %}>Vendido</option>
                <option value="Baja" {% if row['estado'] == 'Baja' %}selected{% endif %}>Baja</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Destino (Carne/Leche)</label>
              <select name="destino_carne" class="form-select bg-dark text-light border-secondary">
                <option value="Carne" {% if row['destino_carne'] == 'Carne' %}selected{% endif %}>Carne</option>
                <option value="Leche" {% if row['destino_carne'] == 'Leche' %}selected{% endif %}>Leche</option>
                <option value="Cría" {% if row['destino_carne'] == 'Cría' %}selected{% endif %}>Cría</option>
                <option value="Doble Propósito" {% if row['destino_carne'] == 'Doble Propósito' %}selected{% endif %}>Doble Propósito</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Peso Canal (kg)</label>
              <input type="number" step="0.01" name="peso_canal" class="form-control bg-dark text-light border-secondary" value="{{ row['peso_canal'] }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Precio Venta Unitario ($)</label>
              <input type="number" step="0.01" name="precio_venta" class="form-control bg-dark text-light border-secondary" value="{{ row['precio_venta'] }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Valor Total ($)</label>
              <input type="number" step="0.01" name="valor_total" class="form-control bg-dark text-light border-secondary" value="{{ row['valor_total'] }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Fecha de Venta</label>
              <input type="date" name="fecha_venta" class="form-control bg-dark text-light border-secondary" value="{{ row['fecha_venta'] }}">
            </div>
          </div>
        </div>

        <!-- Botones de Acción -->
        <div class="d-flex justify-content-between gap-3">
          <a href="{{ url_for('ganado_list') }}" class="btn btn-outline-secondary btn-lg flex-grow-1">
            <i class="bi bi-x-circle me-2"></i>Cancelar
          </a>
          <button type="submit" class="btn btn-warning btn-lg text-dark fw-bold flex-grow-1 shadow-sm">
            <i class="bi bi-check-circle-fill me-2"></i>Actualizar Registro
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
